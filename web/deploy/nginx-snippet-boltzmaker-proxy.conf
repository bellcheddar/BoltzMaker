# Shared proxy-header block for every location in nginx-boltzmaker.conf that proxies to
# gunicorn -- installed by provision.sh to /etc/nginx/snippets/boltzmaker-proxy.conf.
# Not one of the droplet's existing shared snippets (those are long-cache.conf for
# static assets); this one is boltzmaker-specific since its proxy_read_timeout (900s,
# for `analyze`'s PLIP interaction detection + compare-sse external API lookups, on top
# of the base subprocess cost) is much longer than AlphaFraud's own 90s. Must stay in
# sync with gunicorn.conf.py's `timeout` and runner.py's own analyze timeout.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
